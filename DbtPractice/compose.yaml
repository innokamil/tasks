services:
  app:
    build:
      context: ./airflow
      target: dev
    networks:
      - front-tier
      - back-tier
      - kind
    ports:
      - 8080:8080
    depends_on:
      pagila-db:
        condition: service_healthy
      sakila-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: .
          initial_sync: true
  pagila-db:
    image: postgres:17
    container_name: pagila
    networks:
      - back-tier
      - kind
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "pagila"
    volumes:
      - pagila-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "sh -c pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 120s
      retries: 5
      start_period: 60s

  sakila-db:
    image: postgres:17
    container_name: sakila 
    networks:
      - back-tier
      - kind
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "sakila"
    volumes:
      - sakila-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "sh -c pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 120s
      retries: 5
      start_period: 60s
volumes:
  pagila-data: {}
  sakila-data: {}
networks:
  front-tier: {}
  back-tier: {}
  kind:
    # kind is the network that airbyte creates while running locally
    external: true
