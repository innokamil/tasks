services:
  mongo-express-ui:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://root:root@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=webroot
      - ME_CONFIG_BASICAUTH_PASSWORD=webroot
    networks:
      - back 
    depends_on:
      - mongo  
  mongo:
    image: mongo 
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root 
    volumes:
      - mongo-vol:/data/db
    ports:
      - 27017:27017
    expose:
      - 27017
    healthcheck:
      # test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      test: ["CMD-SHELL", "mongosh --username root --password root --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5    
    networks:
      - back 
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - data-vol:/app/data/
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    networks:
      - front 
      - back
volumes:
  mongo-vol: {}
  data-vol: {}

networks:
  back: {}
  front: {}
